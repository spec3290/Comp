[project]
name = "comp"
version = "0.1.0"
description = "대회 수집 서비스 백엔드 (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.159.1",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "pymongo>=4.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
]

# ──────────────────────────────────────────────────────────────
# 아키텍처 제약 (설명: AGENTS.md '아키텍처 제약', 근거: docs/decisions.md ADR-0001)
# 이 섹션을 약화하려면 먼저 docs/decisions.md 에 ADR을 추가한다.
# ──────────────────────────────────────────────────────────────
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "AC-1"
name = "AC-1 레이어 방향: api/jobs -> services -> repositories -> domain"
type = "layers"
layers = [
    "app.api | app.jobs",
    "app.services",
    "app.repositories",
    "app.domain",
]

[[tool.importlinter.contracts]]
id = "AC-2"
name = "AC-2 domain은 순수 파이썬 (프레임워크·IO 금지)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.infra",
    "sqlalchemy",
    "fastapi",
    "starlette",
    "httpx",
    "jwt",
]

[[tool.importlinter.contracts]]
id = "AC-3"
name = "AC-3 services는 인프라·웹·ORM을 직접 알지 못한다 (ports 경유)"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.infra",
    "app.repositories.models",
    "sqlalchemy",
    "fastapi",
    "starlette",
    "httpx",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "AC-4"
name = "AC-4 api/jobs는 repositories를 직접 쓰지 않는다 (조립 루트 deps/runner 예외)"
type = "forbidden"
source_modules = ["app.api", "app.jobs"]
forbidden_modules = ["app.repositories"]
allow_indirect_imports = true
# 조립 루트는 아직 비어 있을 수 있으므로 매칭되지 않는 예외는 경고하지 않는다
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "app.api.deps -> app.repositories",
    "app.api.deps -> app.repositories.*",
    "app.jobs.runner -> app.repositories",
    "app.jobs.runner -> app.repositories.*",
]

[[tool.importlinter.contracts]]
id = "AC-5"
name = "AC-5 infra는 상위 레이어를 import하지 않는다"
type = "forbidden"
source_modules = ["app.infra"]
forbidden_modules = ["app.api", "app.jobs", "app.services"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "AC-6"
name = "AC-6 repositories는 services/api를 알지 못한다 (layers와 별개로 ORM 격리 보장)"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = ["app.services", "app.api", "app.jobs"]
allow_indirect_imports = true

# ──────────────────────────────────────────────────────────────
# 린트 / 타입 / 테스트
# ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "C90", "T20",
    "S",    # 보안 (하드코딩 비밀번호, assert 등)
    "DTZ",  # naive datetime 금지 (KST 일관성, 규칙 R-3)
    "TID",  # 금지 import
]
ignore = ["S101"]  # pytest 의 assert 허용

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "HTTP 클라이언트는 httpx만 사용한다 (AGENTS.md)."

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "feature(id): 이 테스트가 검증하는 기능 ID (예: F2-2). docs/features.md 참고",
]
