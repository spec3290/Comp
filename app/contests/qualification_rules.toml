# 자격 분류 키워드 규칙 (F3-1, Q-8 초안).
#
# 대회 제목 + 참가 자격 원문에 keywords 중 하나라도 들어 있으면 value 태그를 붙인다.
# 비교할 때 공백은 무시하고 대소문자를 가리지 않는다 ("제한 없음" == "제한없음").
# 어떤 규칙도 맞지 않은 차원은 미분류이고, 목록에서 빠지지 않고 '자격 확인 필요'로 보인다.
#
# 잘못 붙은 태그는 대회를 필터에서 숨기므로, 애매한 단어는 넣지 않는다.
#   - "개인"은 "개인정보"에, "팀"은 "팀장"·"운영팀"에도 들어 있어 단독으로 쓰지 않는다.
#   - "제한 없음" 단독은 "참가 인원 제한 없음"에도 들어 있어 "학력 제한 없"처럼 대상을 붙여 쓴다.
#     문장부호는 지우지 않으므로("운영팀. 참가"가 "팀 참가"로 붙지 않게) "학력: 제한 없"도 따로 둔다.
#   - "N명 이내"는 "선착순 100명 이내"처럼 인원 제한일 수 있어 팀 키워드로 쓰지 않는다.
#   - 지역명 단독("서울")은 개최 장소일 수 있어 "서울 거주"처럼 자격을 뜻하는 표현만 쓴다.
# dimension·value 의 허용 값은 app/contests/rules.py 의 enum 이 정한다.

# ── 학력 ────────────────────────────────────────────

[[rules]]
dimension = "education"
value = "고등학생"
keywords = ["고등학생", "고교생", "고등학교 재학", "고등부"]

[[rules]]
dimension = "education"
value = "대학생"
keywords = ["대학생", "대학원생", "대학(원)생", "대학교 재학", "대학 재학", "학부생", "대학부"]

[[rules]]
dimension = "education"
value = "제한 없음"
keywords = [
    "누구나",
    "학력 제한 없",
    "학력: 제한 없",
    "참가 제한 없",
    "자격 제한 없",
    "자격: 제한 없",
    "대상: 제한 없",
    "일반인",
    "전 국민",
    "일반부",
]

# ── 참가 형태 ───────────────────────────────────────

[[rules]]
dimension = "team_type"
value = "개인"
keywords = ["개인 참가", "개인으로 참가", "개인 또는 팀", "개인/팀", "개인 혹은 팀", "개인전"]

[[rules]]
dimension = "team_type"
value = "팀"
keywords = [
    "팀 참가",
    "팀으로 참가",
    "팀 구성",
    "팀 단위",
    "팀원",
    "개인 또는 팀",
    "개인/팀",
    "개인 혹은 팀",
    "인 1팀",
    "인 1조",
    "팀전",
]

# ── 지역 ────────────────────────────────────────────

