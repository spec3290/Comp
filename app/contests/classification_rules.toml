# 분야·형식 분류 규칙 (F3-1, Q-23).
#
# 참가 자격(학력·참가 형태·지역)은 근거가 되는 원문을 주는 소스가 없어 분류하지 않는다.
# 잘못 붙은 태그는 대회를 필터에서 숨기므로, 근거가 분명한 것만 태그로 붙이고 나머지는 미분류로 둔다.
# 미분류 대회는 필터에서 빠지지 않고 '분류 확인 필요'로 함께 보인다.
# 비교할 때 공백은 무시하고 대소문자를 가리지 않는다.
# value·fields·format 의 허용 값은 app/contests/rules.py 의 enum 이 정한다.

# ── 소스 기본값 ─────────────────────────────────────
# fields 는 그 소스의 모든 대회에 붙인다. format 은 제목에 형식 단어가 없을 때만 쓴다.
# 키는 크롤러의 NAME 이다.

# 데이터·AI 경진대회만 여는 플랫폼이다.
[sources.dacon]
fields = ["AI"]
format = "경진대회"

# 소프트웨어를 만들어 제출하는 해커톤 플랫폼이다.
[sources.devpost]
fields = ["개발"]
format = "해커톤"

# Dev Event 는 세미나·대회를 함께 싣는 행사 목록이라 기본값이 없다.
# 이벤터스(event_us)·코드포코리아(code4korea)도 형식이 섞인 행사 목록이라 기본값이 없다.
#   이벤터스는 세부 분야와 태그(예: 'AI'), 코드포코리아는 '행사 주제' 열이 소스 태그다.

# ── 분야: 소스가 붙인 태그 → 분야 ─────────────────────
# 소스 태그와 통째로 같아야 한다(부분 일치 아님). 추측이 필요한 태그는 넣지 않는다.
#   - Dev Event '기술일반' 은 보안·게임·앱 대회에 두루 붙어 분야를 알 수 없다.
#   - Devpost 'Open Ended'·'Social Good'·'Education' 등은 주제이지 분야가 아니다.

[[field]]
value = "개발"
source_tags = [
    "블록체인",      # Dev Event
    "클라우드",      # Dev Event
    "개발",          # DACON
    "서비스 개발",   # DACON
    "AI·SW개발",     # DACON
    "바이브 코딩",   # DACON
    "SW부문",        # DACON
]

[[field]]
value = "AI"
source_tags = [
    "AI",                   # Dev Event
    "Machine Learning/AI",  # Devpost
]

[[field]]
value = "보안"
source_tags = [
    "Cybersecurity",  # Devpost
    "사이버 보안",    # DACON
]

[[field]]
value = "디자인"
source_tags = [
    "Design",  # Devpost
]

[[field]]
value = "아이디어"
source_tags = [
    "아이디어",       # DACON
    "분석 아이디어",  # DACON
    "분석아이디어",   # DACON
]

# ── 형식: 제목에 들어 있는 단어 ───────────────────────
# '챌린지'·'콘테스트'·'대회' 는 형식이 제각각이라 넣지 않는다.

[[format]]
value = "해커톤"
keywords = ["해커톤", "hackathon"]

[[format]]
value = "경진대회"
keywords = ["경진대회"]

[[format]]
value = "공모전"
keywords = ["공모전"]

[[format]]
value = "아이디어톤"
keywords = ["아이디어톤", "ideathon"]
