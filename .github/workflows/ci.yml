name: ci

# 이 프로젝트의 검증은 전부 여기서 한다 (docs/decisions.md ADR-0006).
# 머지 조건: 이 워크플로 성공 + 최소 1명의 approve (브랜치 보호 규칙에서 필수 체크로 지정할 것).
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint / type / architecture / test
    runs-on: ubuntu-latest
    # MongoDB 통합 테스트(중복 제거 F2-2 등)용. 테스트마다 임시 DB 를 만들고 지운다.
    # 8.0+ 는 러너의 Linux 커널 6.19+ 에서 기동하지 못해 7 을 쓴다 (SERVER-121912).
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: 포맷
        run: uv run ruff format --check .
      - name: 린트
        run: uv run ruff check .
      - name: 타입 (mypy strict)
        run: uv run mypy
      - name: 아키텍처 제약 (import-linter, AC-1~AC-3)
        run: uv run lint-imports
      - name: 테스트
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered

  image:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        run: docker build -t comp:ci .
      # 기동 시 JWT_SECRET 만 검증하고 DB·Redis 는 첫 요청 때 붙으므로 비밀 값 없이 /health 를 확인한다
      - name: 컨테이너 기동과 /health 확인
        run: |
          docker run -d --name comp -p 8000:8000 \
            -e JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" comp:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs comp
          exit 1
      - name: 같은 이미지로 마이그레이션·수집 명령을 찾을 수 있는지 확인
        run: |
          docker run --rm comp:ci alembic --help > /dev/null
          docker run --rm comp:ci python -c "import app.contests.collect"
      # docker-compose.yml 의 app 프로필: 실제 PostgreSQL 에 마이그레이션을 걸고 그 뒤에 API 가 뜨는지 본다
      - name: compose app 프로필로 마이그레이션과 API 기동 확인
        run: |
          docker rm -f comp  # 앞 단계 컨테이너가 8000 포트를 쥐고 있다
          echo "JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" > .env
          docker compose --profile app up -d --build --wait api \
            || { docker compose --profile app logs; exit 1; }
          curl -fsS http://127.0.0.1:8000/health
          docker compose --profile app logs migrate
          docker compose --profile app down -v

  conventions:
    name: git conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 커밋 메시지 · 브랜치명 · PR 제목
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_conventions.py --base "origin/$BASE_REF" --head-ref "$HEAD_REF" --title "$PR_TITLE"
