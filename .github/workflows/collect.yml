name: collect

# 대회 수집(F2-1)을 하루 1회 실행한다 (docs/decisions.md Q-21).
# 저장소 Settings > Secrets and variables > Actions 에 다음을 넣어야 한다.
#   Secrets: MONGODB_URI(Atlas 접속 URI), ATLAS_PUBLIC_KEY, ATLAS_PRIVATE_KEY
#   Variables: ATLAS_PROJECT_ID, MONGODB_DB(선택, 기본 contest)
# 러너 IP는 실행마다 바뀌므로 수집 전에 Atlas IP Access List에 임시로 넣고 끝나면 지운다 (Q-22).
# API 키에는 프로젝트 역할 Project Network Access Manager 만 준다.
# 소스 하나라도 실패하면 수집 명령이 1로 끝나 이 실행이 실패로 표시된다. 기존 데이터는 유지된다.
on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST (cron 은 UTC 기준)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

env:
  ATLAS_API: https://cloud.mongodb.com/api/atlas/v2/groups/${{ vars.ATLAS_PROJECT_ID }}/accessList
  ATLAS_ACCEPT: "Accept: application/vnd.atlas.2023-01-01+json"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --no-dev
      - name: 러너 IP를 Atlas 허용 목록에 임시 등록
        env:
          ATLAS_AUTH: ${{ secrets.ATLAS_PUBLIC_KEY }}:${{ secrets.ATLAS_PRIVATE_KEY }}
        run: |
          ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          # 정리 단계가 돌지 못해도 Atlas가 1시간 뒤 스스로 지운다.
          expire="$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)"
          curl -sS --fail-with-body --digest -u "$ATLAS_AUTH" -H "$ATLAS_ACCEPT" -H "Content-Type: application/json" \
            -X POST "$ATLAS_API" \
            -d "[{\"ipAddress\":\"$ip\",\"comment\":\"github-actions collect\",\"deleteAfterDate\":\"$expire\"}]" \
            > /dev/null
          echo "RUNNER_IP=$ip" >> "$GITHUB_ENV"
          # 등록 직후에는 PENDING 이라 ACTIVE 가 될 때까지 기다린다.
          for _ in $(seq 1 30); do
            status="$(curl -sS --fail-with-body --digest -u "$ATLAS_AUTH" -H "$ATLAS_ACCEPT" "$ATLAS_API/$ip/status" | jq -r .STATUS)"
            echo "access list: $status"
            [ "$status" = "ACTIVE" ] && exit 0
            sleep 10
          done
          echo "::error::Atlas 허용 목록 항목이 5분 안에 ACTIVE가 되지 않았다"
          exit 1
      - name: 대회 수집
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'contest' }}
        run: uv run --no-dev python -m app.contests.collect
      - name: Atlas 허용 목록에서 러너 IP 삭제
        if: always() && env.RUNNER_IP != ''
        env:
          ATLAS_AUTH: ${{ secrets.ATLAS_PUBLIC_KEY }}:${{ secrets.ATLAS_PRIVATE_KEY }}
        run: |
          curl -sS --fail-with-body --digest -u "$ATLAS_AUTH" -H "$ATLAS_ACCEPT" -X DELETE "$ATLAS_API/$RUNNER_IP" > /dev/null
