name: deploy

# develop 에 머지되어 image.yml 이 이미지를 올리면 그 커밋의 이미지(sha-<7자리>)를 EC2 에 배포한다 (docs/decisions.md Q-37).
# 수동 실행(workflow_dispatch)에 이전 태그를 넣으면 롤백이다. 서버 준비는 README 'EC2 자동 배포'.
# 저장소 Settings > Secrets and variables > Actions 에 다음을 넣어야 한다.
#   Variables: DOCKERHUB_USERNAME(image.yml 과 같다), EC2_HOST(Elastic IP 나 도메인), EC2_USER(예: ubuntu),
#              EC2_KNOWN_HOSTS(서버 호스트 키 줄, `ssh-keyscan -t ed25519 <EC2_HOST>`),
#              AWS_REGION(예: ap-northeast-2), EC2_SECURITY_GROUP_ID(sg-...),
#              HEALTH_URL(선택. 주면 배포 뒤 러너에서 이 주소를 확인한다, 예: https://api.example.com/health)
#   Secrets:   EC2_SSH_KEY(EC2 키 페어의 개인 키), AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#              DOCKERHUB_TOKEN(image.yml 과 같다. 저장소가 비공개일 때 서버가 받는 데 쓴다)
# 22 포트는 평소 닫아 두고 배포하는 동안만 러너 IP(/32)를 보안 그룹에 연다(collect.yml 의 Atlas 처리와 같은 방식).
# AWS 키에는 이 보안 그룹의 ec2:AuthorizeSecurityGroupIngress·ec2:RevokeSecurityGroupIngress 와
# ec2:DescribeSecurityGroupRules 만 준다 (README 의 IAM 정책 예시).
on:
  workflow_run:
    workflows: [image]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      tag:
        description: "배포할 이미지 태그 (예: sha-abc1234, develop, 1.2.3)"
        required: true

permissions:
  contents: read

# 배포가 겹치면 보안 그룹 규칙과 컨테이너 교체가 엉키므로 하나씩, 진행 중인 것은 끊지 않는다
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RULE_DESCRIPTION: github-actions-deploy

jobs:
  deploy:
    name: deploy to EC2
    # image 가 실패했거나 develop 외(v* 태그 등)에서 돈 경우는 배포하지 않는다
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ec2
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/comp
      SSH_TARGET: ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}
    steps:
      # 설정이 빠졌을 때 뒤 단계의 알기 어려운 오류 대신 무엇을 넣어야 하는지 알려 준다
      - name: 배포 설정 확인
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for name in DOCKERHUB_USERNAME EC2_HOST EC2_USER EC2_KNOWN_HOSTS AWS_REGION EC2_SECURITY_GROUP_ID; do
            [ -n "${!name}" ] || { echo "::error::Variables 에 $name 이 없다"; missing=1; }
          done
          for name in EC2_SSH_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || { echo "::error::Secrets 에 $name 이 없다"; missing=1; }
          done
          exit "$missing"

      # image.yml 의 docker/metadata-action 이 붙인 sha-<7자리> 태그와 맞춘다
      - name: 배포할 태그 계산
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="${INPUT_TAG:-sha-${HEAD_SHA::7}}"
          # 원격 셸 명령에 들어가므로 태그에 쓸 수 있는 문자만 받는다
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::잘못된 태그: $tag"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "배포할 이미지: $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"

      # 서버에 올릴 compose·스크립트가 이미지와 같은 커밋이 되게 한다
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 러너 IP 를 보안 그룹 22 포트에 임시 등록
        env:
          SG: ${{ vars.EC2_SECURITY_GROUP_ID }}
        run: |
          # 이전 실행의 정리 단계가 돌지 못해 남은 규칙이 있으면 먼저 지운다(Atlas 와 달리 스스로 만료되지 않는다)
          stale="$(aws ec2 describe-security-group-rules --filters "Name=group-id,Values=$SG" \
            --query "SecurityGroupRules[?Description=='$RULE_DESCRIPTION'].SecurityGroupRuleId" --output text)"
          if [ -n "$stale" ] && [ "$stale" != "None" ]; then
            # shellcheck disable=SC2086 # 규칙 id 여러 개를 인자로 나눠 넘긴다
            aws ec2 revoke-security-group-ingress --group-id "$SG" --security-group-rule-ids $stale > /dev/null
          fi
          ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          rule_id="$(aws ec2 authorize-security-group-ingress --group-id "$SG" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$ip/32,Description=$RULE_DESCRIPTION}]" \
            --query "SecurityGroupRules[0].SecurityGroupRuleId" --output text)"
          echo "RULE_ID=$rule_id" >> "$GITHUB_ENV"

      # 호스트 키는 미리 받아 둔 값만 믿는다(배포 때 ssh-keyscan 으로 받으면 가짜 서버를 가려내지 못한다)
      - name: SSH 준비
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ServerAliveInterval 15
          EOF
          # 보안 그룹 규칙이 퍼질 때까지 잠깐 걸릴 수 있다
          for _ in $(seq 1 6); do
            ssh "$SSH_TARGET" true && exit 0
            sleep 5
          done
          echo "::error::$SSH_TARGET 에 SSH 로 붙지 못했다 (EC2_HOST·EC2_USER·EC2_KNOWN_HOSTS·키 확인)"
          exit 1

      - name: 서버에 compose·배포 스크립트 복사
        run: |
          ssh "$SSH_TARGET" 'mkdir -p ~/comp'
          scp deploy/docker-compose.yml deploy/deploy.sh "$SSH_TARGET:comp/"

      # 토큰은 명령줄이 아니라 표준 입력으로 넘겨 서버의 프로세스 목록·셸 기록에 남지 않게 한다
      - name: 마이그레이션과 API 교체
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          login=""
          [ -n "$DOCKERHUB_TOKEN" ] && login="DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME"
          # 값을 러너에서 펼쳐 넘기는 것이 의도다. TAG 는 앞 단계에서 문자를 검사했다
          # shellcheck disable=SC2029
          printf '%s' "$DOCKERHUB_TOKEN" \
            | ssh "$SSH_TARGET" "IMAGE=$IMAGE TAG=$TAG $login bash comp/deploy.sh"

      - name: 공개 주소로 /health 확인
        if: vars.HEALTH_URL != ''
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          for _ in $(seq 1 12); do
            curl -fsS "$HEALTH_URL" && exit 0
            sleep 5
          done
          echo "::error::$HEALTH_URL 이 응답하지 않는다 (보안 그룹의 API 포트, 리버스 프록시 확인)"
          exit 1

      - name: 보안 그룹에서 러너 IP 삭제
        if: always() && env.RULE_ID != ''
        env:
          SG: ${{ vars.EC2_SECURITY_GROUP_ID }}
        run: aws ec2 revoke-security-group-ingress --group-id "$SG" --security-group-rule-ids "$RULE_ID" > /dev/null

      - name: SSH 키 삭제
        if: always()
        run: rm -f ~/.ssh/id_deploy
